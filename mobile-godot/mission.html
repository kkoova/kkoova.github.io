<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MISSION // UI</title>
    <link rel="stylesheet" href="../../../../it-course/style.css">
    <script src="../../../../it-course/script.js"></script>
    <style>
.text-accent {
    color: var(--accent-yellow);
    font-weight: bold;
    text-shadow: 0 0 5px rgba(255, 251, 5, 0.3);
}
        .step-card {
    position: relative;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 40px;
    max-width: 800px;
    margin: 0 auto 40px;
    transition: 0.5s;
}

.phase-badge {
    position: absolute;
    top: 20px; right: 30px;
    font-family: 'NDot';
    font-size: 0.8rem;
    opacity: 0.3;
    letter-spacing: 2px;
}

.steps-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin: 20px 0;
}

.grid-step {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    transition: 0.3s;
}

.grid-step:hover {
    border-color: var(--accent-yellow);
}

.code-container {
    background: #050505;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    margin: 20px 0;
    position: relative;
    overflow: hidden;
}

.code-header {
    background: rgba(255, 255, 255, 0.03);
    padding: 8px 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.code-title {
    font-size: 0.7rem;
    font-family: 'NDot', sans-serif;
    color: #888;
    letter-spacing: 1px;
}

.copy-btn {
    background: transparent;
    border: 1px solid rgba(255, 251, 5, 0.3);
    color: var(--accent-yellow);
    font-family: 'NDot', sans-serif;
    font-size: 0.6rem;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: 0.3s;
}

.copy-btn:hover {
    background: var(--accent-yellow);
    color: #000;
}

.code-container pre {
    margin: 0;
    padding: 20px;
    overflow-x: auto;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 0.85rem;
    line-height: 1.5;
    color: #d1d1d1;
}

/* Стилизация скроллбара внутри кода */
.code-container pre::-webkit-scrollbar { height: 4px; }
.code-container pre::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }

.step-num {
    position: absolute;
    top: 10px; right: 15px;
    font-family: 'NDot';
    font-size: 0.8rem;
    opacity: 0.2;
}

.scene-tree-box {
    background: rgba(0, 0, 0, 0.3);
    padding: 20px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    margin: 20px 0;
}

.tree-node {
    display: flex;
    align-items: center;
    padding: 6px 0;
    position: relative;
}

.tree-connector {
    position: absolute;
    left: -15px;
    top: -10px;
    width: 12px;
    height: 22px;
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    border-bottom-left-radius: 4px;
}

.tree-node.indent { margin-left: 25px; border-left: 1px solid #333; padding-left: 15px; position: relative; }
.tree-node.indent::before {
    content: '';
    position: absolute;
    left: 0; top: 15px;
    width: 10px; height: 1px;
    background: #333;
}

.node-icon {
    width: 14px;
    height: 14px;
    margin-right: 10px;
    border-radius: 3px;
    flex-shrink: 0;
    box-shadow: 0 0 8px rgba(0,0,0,0.5);
}

.node-info {
    display: flex;
    align-items: baseline;
    gap: 8px;
}

.node-name {
    font-size: 0.95rem;
    color: #efefef;
    font-weight: 500;
}

.node-type {
    font-size: 0.7rem;
    color: #666;
    font-family: 'NDot', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Оживляем дерево: подсветка при наведении */
.tree-node:hover .node-name {
    color: var(--accent-yellow);
}

/* Системный лог (Твои пункты 1-2) */
.system-log {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 251, 5, 0.2);
    padding: 20px;
    margin: 25px 0;
    border-radius: 12px;
}

.log-header {
    font-size: 0.7rem;
    opacity: 0.5;
    margin-bottom: 15px;
}

.tutorial-image-container {
    margin: 25px 0;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    overflow: hidden;
    padding: 10px;
    text-align: center;
}

.tree-toggle {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'NDot', sans-serif;
    font-size: 0.8rem;
    color: var(--accent-yellow);
    transition: transform 0.2s;
    margin-right: 5px;
    user-select: none;
}

/* Состояние, когда ветка свернута */
.tree-node.collapsed .tree-toggle {
    transform: rotate(-90deg); /* Поворачиваем стрелку */
}

.code-comment {
    color: #555555; /* Очень тусклый серый для комментариев */
    font-style: italic;
}

.code-keyword {
    color: #ffffff; /* Белый для системных слов */
    font-weight: bold;
}

.code-func {
    color: var(--accent-yellow); /* Твой желтый для названий функций */
}

.code-string {
    color: #4ed162; /* Зеленоватый для путей к файлам и строк (цвет Godot) */
}

.code-annotation {
    color: #ff8b39; /* Мягкий оранжевый для @export */
}

/* Добавим моноширинный шрифт, если еще нет */
.code-container pre code {
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-variant-ligatures: none;
}

/* Скрываем детей */
.tree-node.collapsed + .tree-group {
    display: none;
}

/* Контейнер для группы дочерних элементов */
.tree-group {
    border-left: 1px solid rgba(255, 255, 255, 0.05);
    margin-left: 15px; /* Базовый отступ для группы */
}

/* Подсветка при наведении, чтобы было понятно, что кликабельно */
.tree-node.has-children:hover {
    background: rgba(255, 251, 5, 0.05);
    border-radius: 4px;
}

.tutorial-image-container img {
    width: 100%;
    height: auto;
    border-radius: 10px;
    display: block;
    /* Легкий технический фильтр, чтобы картинки выглядели стильно (по желанию) */
    filter: contrast(1.05) saturate(0.9);
    transition: 0.3s;
}

/* Эффект при наведении: картинка становится ярче */
.tutorial-image-container img:hover {
    filter: none;
}

/* Техническая подпись снизу */
.image-caption {
    font-family: 'NDot', sans-serif;
    font-size: 0.65rem;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 10px;
    padding-bottom: 5px;
}

.config-list { list-style: none; padding: 0; margin-bottom: 20px;}
.config-list li { margin-bottom: 8px; font-size: 0.9rem; }
.config-list .param { color: #888; }
.config-list .val { color: var(--accent-yellow); }

.window-settings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.setting-row { font-size: 1.2rem; }
.s-label { color: #666; font-size: 1rem; margin-bottom: 4px; }
.s-value { color: #fff; font-weight: bold; }

.tip-box {
    font-size: 0.8rem;
    color: #888;
    border-left: 2px solid var(--accent-yellow);
    padding-left: 15px;
    margin: 20px 0;
}
    </style>
</head>
<body class="nothing-os doc-page">
    <div class="smart-dots-layer"></div>
    <div class="doc-container">
        <header>
            <span id="unit-label" class="type-body"></span>
            <h1 id="unit-title" class="matrix-text" style="color: var(--accent-yellow);"></h1>
        </header>

        
        <div id="doc-content"></div> 
    </div>

    <script src="./js/renderer.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        const docName = urlParams.get('doc') || 'tutorial_01.json';

        console.log("SYSTEM // Loading document:", docName);

        fetch(`./assets/docs/${docName}`)
            .then(res => {
                if (!res.ok) throw new Error("Document not found");
                return res.json();
            })
            .then(data => renderLesson(data))
            .catch(err => {
                document.getElementById('doc-content').innerHTML = 
                    `<div class="type-body yellow">ERROR // DOCUMENT_NOT_FOUND: ${docName}</div>`;
            });
    </script>
</body>
</html>
