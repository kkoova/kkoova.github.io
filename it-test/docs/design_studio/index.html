<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DESIGN STUDIO - интерактивный практикум</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#0d1117; --panel:#151b24; --panel2:#1b232e; --line:#26303d;
  --txt:#e8eef7; --muted:#8b98ab; --accent:#7c5cff; --accent2:#22d3ee;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.45; min-height:100vh;
  background-image:radial-gradient(900px 500px at 8% -10%,rgba(124,92,255,.20),transparent 60%),
                   radial-gradient(800px 500px at 100% 0%,rgba(34,211,238,.12),transparent 55%);
  background-attachment:fixed;
}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.2}
p{margin:0}
button{font:inherit}

.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);
  background:rgba(13,17,23,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:60;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.16em;font-size:13px;white-space:nowrap}
.logo b{color:var(--accent)}
.stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-size:11px;
  color:var(--muted);display:flex;gap:7px;align-items:center;letter-spacing:.04em;text-transform:uppercase}
.stat b{font-size:14px;color:var(--txt);letter-spacing:0;text-transform:none}
.stat.pts b{color:var(--accent2)}
.stat.rep b{color:var(--ok)}
.stat.bud b{color:var(--warn)}
.mini-btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;
  padding:7px 13px;font-size:12px;cursor:pointer;transition:.15s}
.mini-btn:hover{border-color:var(--accent);color:#fff}

.steps{display:flex;gap:8px;padding:11px 20px;overflow-x:auto;border-bottom:1px solid var(--line);
  background:rgba(13,17,23,.5)}
.step{flex:0 0 auto;display:flex;gap:9px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:7px 14px;color:var(--muted);cursor:pointer;font-size:12.5px;transition:.15s}
.step:disabled{opacity:.35;cursor:not-allowed}
.step:not(:disabled):hover{border-color:#3b4a5e;color:var(--txt)}
.step.active{border-color:var(--accent);color:#fff;
  background:linear-gradient(135deg,rgba(124,92,255,.30),rgba(34,211,238,.12))}
.step .num{width:20px;height:20px;border-radius:50%;background:#0d1117;display:grid;place-items:center;
  font-size:11px;font-weight:800;flex:0 0 auto}
.step.done .num{background:var(--ok);color:#04120c}
.step .sub{font-size:10.5px;opacity:.65;display:block}

main{display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,42%);gap:16px;
  padding:16px 20px 60px;align-items:start;max-width:1700px;margin:0 auto}
@media(max-width:1120px){main{grid-template-columns:1fr}}

.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.card h3 .hint{text-transform:none;letter-spacing:0;color:#5f6d80;font-weight:400;font-size:12px}
.card-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
.card h2{font-size:22px;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:12px}
.badge-row{display:flex;gap:8px;flex-wrap:wrap}
.badge{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:12px;color:var(--muted)}
.badge b{color:var(--txt)}
.wishlist{margin:14px 0 0;padding-left:18px;color:#c2cddb;font-size:13.5px}
.wishlist li{margin-bottom:5px}

.options{display:grid;gap:8px}
.opt{text-align:left;background:#0d1117;border:1px solid var(--line);color:var(--txt);border-radius:10px;
  padding:11px 14px;cursor:pointer;font-size:13.5px;transition:.15s}
.opt:hover{border-color:#3b4a5e}
.opt.sel{border-color:var(--accent);background:rgba(124,92,255,.14);box-shadow:0 0 0 1px var(--accent) inset}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#0d1117;border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:7px 14px;font-size:12.5px;cursor:pointer;transition:.15s}
.chip:hover{border-color:#3b4a5e;color:var(--txt)}
.chip.sel{border-color:var(--accent2);color:#04141a;background:var(--accent2);font-weight:600}
.chip.dashed{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.chip.dashed:hover{background:rgba(124,92,255,.12)}

textarea,input[type=text]{width:100%;background:#0d1117;border:1px solid var(--line);border-radius:10px;
  color:var(--txt);padding:10px 12px;font:inherit;outline:none;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--accent)}
label.fl{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px;letter-spacing:.03em}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}

.tile{background:#0d1117;border:1px solid var(--line);border-radius:12px;padding:12px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;transition:.15s}
.tile:hover{border-color:#3b4a5e;color:var(--txt)}
.tile.sel{border-color:var(--accent);background:rgba(124,92,255,.14);color:#fff}
.tile svg{width:26px;height:26px;fill:currentColor}

.swatch-tile{background:#0d1117;border:1px solid var(--line);border-radius:12px;padding:9px;cursor:pointer;transition:.15s}
.swatch-tile:hover{border-color:#3b4a5e}
.swatch-tile.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.swatch-row{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-bottom:7px}
.swatch-row i{flex:1}
.swatch-name{font-size:11px;color:var(--muted)}

.color-inputs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.color-cell{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:10px;color:var(--muted)}
.color-cell input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;
  background:#0d1117;padding:2px;cursor:pointer}

.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input[type=range]{flex:1;accent-color:var(--accent)}
.slider-val{font-variant-numeric:tabular-nums;font-size:12px;color:var(--accent2);min-width:52px;text-align:right}

.toggle-list{display:grid;gap:7px}
.toggle{display:flex;align-items:center;gap:10px;background:#0d1117;border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;cursor:pointer;font-size:13px;transition:.15s}
.toggle:hover{border-color:#3b4a5e}
.toggle.on{border-color:var(--accent2)}
.toggle .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:grid;
  place-items:center;font-size:11px;color:#04141a;flex:0 0 auto}
.toggle.on .box{background:var(--accent2);border-color:var(--accent2)}

.actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:2px}
.primary{background:linear-gradient(135deg,var(--accent),#5b8cff);border:none;color:#fff;border-radius:11px;
  padding:12px 22px;font-weight:700;cursor:pointer;font-size:14px;transition:.15s;
  box-shadow:0 6px 20px rgba(124,92,255,.32)}
.primary:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(124,92,255,.45)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:11px;
  padding:11px 18px;cursor:pointer;font-size:13.5px;transition:.15s}
.ghost:hover{border-color:var(--accent);color:#fff}
.ghost.small{padding:7px 13px;font-size:12px}

.preview{position:sticky;top:86px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;min-width:0}
.prev-tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2);overflow-x:auto}
.ptab{background:transparent;border:1px solid transparent;color:var(--muted);border-radius:8px;
  padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;transition:.15s}
.ptab:hover{color:var(--txt)}
.ptab.active{background:#0d1117;border-color:var(--line);color:#fff}
.prev-stage{padding:18px;max-height:calc(100vh - 210px);overflow:auto}

.logo-showcase{display:flex;flex-direction:column;align-items:center;gap:16px}
.logo-big{background:#0d1117;border:1px solid var(--line);border-radius:16px;padding:26px;display:grid;place-items:center;width:100%;position:relative}
.logo-big.safe{outline:1px dashed rgba(124,92,255,.6);outline-offset:-8px}
.logo-sizes{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:center}
.logo-sizes .sz{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.logo-sizes .sz svg{max-width:64px}
.pal-strip{display:flex;width:100%;border-radius:10px;overflow:hidden;height:48px;border:1px solid var(--line)}
.pal-strip div{flex:1;display:flex;align-items:flex-end;justify-content:center;font-size:9px;padding-bottom:4px;
  font-family:monospace;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.type-sample{width:100%;background:#0d1117;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.type-sample .tx{font-size:12.5px;color:var(--muted);margin-top:6px}

.bcard-wrap{display:flex;flex-direction:column;gap:14px}
.bcard{border-radius:14px;padding:20px;aspect-ratio:1.75/1;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 12px 30px rgba(0,0,0,.35);overflow:hidden;position:relative}
.bcard .logo-box{display:grid;place-items:center;overflow:hidden}
.bcard .logo-box svg{max-width:100%;max-height:100%;width:100%;height:100%}

.browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.browser-bar{display:flex;gap:5px;padding:7px 10px;background:#1b232e;border-bottom:1px solid #26303d}
.browser-bar i{width:8px;height:8px;border-radius:50%;background:#3b4a5e;display:block}
.browser .lg{overflow:hidden;display:grid;place-items:center}
.browser .lg svg{max-width:100%;max-height:100%;width:100%;height:100%}

.poster{width:100%;border-radius:12px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.4);
  display:flex;flex-direction:column;justify-content:center;position:relative}
.poster.poster{aspect-ratio:3/4}
.poster.story{aspect-ratio:9/16;max-width:290px;margin:0 auto}
.poster.square{aspect-ratio:1/1}
.poster .lg{overflow:hidden;display:grid;place-items:center}
.poster .lg svg{width:100%;height:100%}

.modal{position:fixed;inset:0;background:rgba(5,8,12,.78);backdrop-filter:blur(6px);display:none;
  place-items:center;z-index:200;padding:20px}
.modal.open{display:grid}
.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;
  max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-card.wide{max-width:1200px}
.modal-card h2{font-size:26px;margin:6px 0 16px}
.checks{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;background:#0d1117;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.35}
.checks li .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  font-weight:800;flex:0 0 auto;margin-top:1px}
.checks li.ok .ic{background:var(--ok);color:#04120c}
.checks li.bad .ic{background:var(--bad);color:#2a0505}
.checks li .pts{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
.checks li.ok .pts{color:var(--ok)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal-note{background:#0d1117;border-left:3px solid var(--accent2);padding:10px 14px;border-radius:8px;
  font-size:12.5px;color:var(--muted);margin:12px 0}

.grade-card{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(34,211,238,.10));
  border:1px solid var(--accent);border-radius:var(--r);padding:20px}
.grade-num{font-size:46px;font-weight:800;line-height:1;background:linear-gradient(135deg,#fff,var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
table.res{width:100%;border-collapse:collapse;font-size:13px}
table.res td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.res td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.res tr:last-child td{border-bottom:none}
.progress-line{height:6px;border-radius:99px;background:#0d1117;overflow:hidden;margin-top:10px}
.progress-line i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:99px;transition:width .3s}
.violation{font-size:12px;color:var(--bad);display:flex;gap:6px;align-items:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:11px 20px;font-size:13px;opacity:0;
  pointer-events:none;transition:.25s;z-index:300;box-shadow:0 14px 40px rgba(0,0,0,.5);
  display:flex;align-items:center;gap:10px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner{width:14px;height:14px;border:2px solid var(--accent2);border-top-color:transparent;
  border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex:0 0 auto}

/* Welcome / picker */
.welcome{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
  padding:60px 30px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.welcome h2{font-size:26px;margin-bottom:8px}
.welcome p{color:var(--muted);max-width:520px;margin-bottom:20px}
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:20px}
.client-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
  cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.client-card:hover{border-color:var(--accent);transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(124,92,255,.18)}
.client-name{font-size:18px;font-weight:800;color:var(--accent2);letter-spacing:.05em;margin-bottom:6px}
.client-sphere{color:var(--muted);font-size:12.5px;line-height:1.4;margin-bottom:10px;min-height:38px}
.client-meta{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-bottom:10px;
  padding-bottom:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.client-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.tag{background:#0d1117;border:1px solid var(--line);border-radius:999px;padding:2px 8px;
  font-size:10px;color:var(--muted)}

#pdf-render{position:fixed;left:-99999px;top:0;pointer-events:none;}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a3543;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">DESIGN<b>STUDIO</b></div>
  <div class="stats">
    <div class="stat pts">Баллы <b id="stPoints">0</b><span style="opacity:.5">/250</span></div>
    <div class="stat rep">Репутация <b id="stRep">100</b></div>
    <div class="stat bud">Бюджет <b id="stBudget">0 ₽</b></div>
  </div>
  <button class="mini-btn" id="btnNewOrder">Сменить проект</button>
</header>

<nav class="steps" id="steps"></nav>

<main>
  <section class="panel" id="panel"></section>
  <aside class="preview">
    <div class="prev-tabs" id="prevTabs">
      <button class="ptab" data-tab="logo">Логотип</button>
      <button class="ptab" data-tab="card">Визитка</button>
      <button class="ptab" data-tab="site">Сайт</button>
      <button class="ptab" data-tab="poster">Реклама</button>
    </div>
    <div class="prev-stage" id="previewStage"></div>
  </aside>
</main>

<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   КОНСТАНТЫ
   ========================================================= */
const STAGES = [
  {n:1,name:'CLIENT BRIEF',sub:'Анализ заказчика'},
  {n:2,name:'BRAND LAB',sub:'Логотип, цвет, шрифт'},
  {n:3,name:'UI FACTORY',sub:'Макет интерфейса'},
  {n:4,name:'ADVERTISING LAB',sub:'Плакат и носители'},
  {n:5,name:'FINAL PRESENTATION',sub:'Защита проекта'}
];

const TONES = [
  {id:'tech',label:'Технологичный'},{id:'eco',label:'Экологичный'},
  {id:'minimal',label:'Минималистичный'},{id:'bold',label:'Дерзкий'},
  {id:'friendly',label:'Дружелюбный'},{id:'premium',label:'Премиальный'},
  {id:'playful',label:'Игровой'},{id:'brutal',label:'Брутальный'},
  {id:'warm',label:'Тёплый'},{id:'dynamic',label:'Динамичный'}
];
const toneLabel = id => (TONES.find(t=>t.id===id)||{label:id}).label;

const PALETTES = [
  {id:'tech',   name:'Digital Blue',  colors:{primary:'#2563EB',secondary:'#0EA5E9',accent:'#22D3EE',ink:'#0B1220',bg:'#F2F6FF'}},
  {id:'eco',    name:'Fresh Green',   colors:{primary:'#16A34A',secondary:'#84CC16',accent:'#FACC15',ink:'#10231A',bg:'#F1FBF4'}},
  {id:'bold',   name:'Hot Coral',     colors:{primary:'#F97316',secondary:'#EF4444',accent:'#111827',ink:'#111827',bg:'#FFF7ED'}},
  {id:'premium',name:'Midnight Gold', colors:{primary:'#111827',secondary:'#C8A24A',accent:'#F0C86A',ink:'#0B0B0C',bg:'#F7F5F1'}},
  {id:'playful',name:'Candy Pop',     colors:{primary:'#EC4899',secondary:'#8B5CF6',accent:'#FDE047',ink:'#2B1035',bg:'#FFF1FA'}},
  {id:'calm',   name:'Soft Sand',     colors:{primary:'#6B7A8F',secondary:'#C2A98F',accent:'#E8DCCB',ink:'#2B2B2B',bg:'#FAF7F2'}}
];

const SHAPES = [
  {id:'circle',label:'Круг'},{id:'round',label:'Скруглённый квадрат'},
  {id:'hex',label:'Гексагон'},{id:'tri',label:'Треугольник'},
  {id:'shield',label:'Щит'},{id:'ring',label:'Кольцо'},{id:'blob',label:'Блоб'}
];
const SHAPE_ICON = {
  circle:'<circle cx="12" cy="12" r="10"/>',
  round:'<rect x="2" y="2" width="20" height="20" rx="6"/>',
  hex:'<polygon points="12,1 22,6.5 22,17.5 12,23 2,17.5 2,6.5"/>',
  tri:'<polygon points="12,2 22,21 2,21"/>',
  shield:'<path d="M12 1 L22 5 V12 C22 18 17 22 12 23 C7 22 2 18 2 12 V5 Z"/>',
  ring:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="3.5"/>',
  blob:'<path d="M12 1 C19 1 23 6 23 12 C23 19 18 23 12 23 C5 23 1 18 1 12 C1 5 5 1 12 1 Z"/>'
};

const MARKS = [
  {id:'monogram',label:'Монограмма'},{id:'dots',label:'Сетка точек'},
  {id:'spark',label:'Искра'},{id:'wave',label:'Волна'},
  {id:'arrow',label:'Стрелка'},{id:'leaf',label:'Лист'},{id:'none',label:'Без знака'}
];

const FONTS = [
  {id:'sans',   label:'Геометричный гротеск', css:"'Segoe UI',system-ui,-apple-system,sans-serif"},
  {id:'grotesk',label:'Нейтральный гротеск',  css:"Helvetica,Arial,sans-serif"},

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hex2rgb(h){
  h = String(h||'#000000').replace('#','');
  if(h.length===3) h = h.split('').map(c=>c+c).join('');
  if(h.length!==6) h = '000000';
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function hexToRgba(hex, alpha) {
  const [r, g, b] = hex2rgb(hex);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function luminance(h){
  const [r,g,b] = hex2rgb(h).map(v=>{v/=255;return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*r+0.7152*g+0.0722*b;
}
function contrast(a,b){
  const l1 = luminance(a), l2 = luminance(b);
  return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);
}
function fmtMoney(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ') + ' ₽'; }
function bestOn(bg){
  const cands = ['#ffffff','#0b0f14'];
  let best = '#ffffff', bc = -1;
  for(const c of cands){
    const k = contrast(c,bg);
    if(k > bc){ bc = k; best = c; }
  }
  return best;
}
function svgToDataUrl(svg){
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

function fontCss(id){

}

async function addUrlFont(url){
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = url;
  await new Promise((res, rej) => {
    link.onload = res;
    link.onerror = () => rej(new Error('Не удалось загрузить CSS по ссылке'));
    document.head.appendChild(link);
  });
  let family = 'CustomFont';
  const m = url.match(/family=([^:&]+)/);
  if(m) family = decodeURIComponent(m[1].replace(/\+/g,' ')).split(':')[0].trim();
  try { await document.fonts.load(`16px "${family}"`); } catch(e){}
  if(!session.customFonts.find(f=>f.family===family)){
    session.customFonts.push({family, source:'url', cssUrl:url});
  }
  return family;
}

async function addFileFont(file, name){
  const buf = await file.arrayBuffer();
  const cleanName = name || file.name.replace(/\.[^.]+$/, '');
  const font = new FontFace(cleanName, buf);
  await font.load();
  document.fonts.add(font);
  const dataUrl = await new Promise(r => {
    const fr = new FileReader();
    fr.onload = () => r(fr.result);
    fr.readAsDataURL(file);
  });
  if(!session.customFonts.find(f=>f.family===cleanName)){
    session.customFonts.push({family: cleanName, source:'file', dataUrl});
  }
  return cleanName;
}

/* =========================================================
   SVG
   ========================================================= */
function sanitizeSVG(text){
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'image/svg+xml');
    if(doc.querySelector('parsererror')) return null;
    const svg = doc.querySelector('svg');
    if(!svg) return null;
    svg.querySelectorAll('script,foreignObject').forEach(n => n.remove());
    svg.querySelectorAll('*').forEach(n => {
      for(const a of Array.from(n.attributes)) {
        if(/^on/i.test(a.name)) n.removeAttribute(a.name);
      }
    });
    svg.querySelectorAll('image').forEach(n => {
      const href = n.getAttribute('href') || n.getAttribute('xlink:href') || '';
      if(!href.startsWith('data:')) n.remove();
    });
    if(!svg.getAttribute('viewBox')){
      const w = parseFloat(svg.getAttribute('width')) || 100;
      const h = parseFloat(svg.getAttribute('height')) || 100;
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    }
    svg.removeAttribute('width');
    svg.removeAttribute('height');
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    return svg.outerHTML;
  } catch(e) { return null; }
}

function getCustomLogoInfo(){
  if(!state.brand.customLogo) return null;
  const doc = new DOMParser().parseFromString(state.brand.customLogo.svg, 'image/svg+xml');
  const svg = doc.querySelector('svg');
  if(!svg) return null;
  return {
    nodes: svg.querySelectorAll('*').length,
    hasViewBox: !!svg.getAttribute('viewBox'),
    hasText: svg.querySelectorAll('text').length > 0,
    hasExternalImage: Array.from(svg.querySelectorAll('image')).some(n => {
      const h = n.getAttribute('href') || n.getAttribute('xlink:href') || '';
      return h && !h.startsWith('data:');
    })
  };
}

  }
  if((cl.forbid.palettes||[]).includes(b.paletteId)){
    violations.push('Клиент просил не использовать такую палитру');
    rep -= 15; spend += 4000;
  }
  const cr = contrast(b.colors.ink, b.colors.bg);
  if(cr < 4.5){
    violations.push('Низкий контраст текста: ' + cr.toFixed(1) + ':1 (нужно ≥ 4.5:1)');
    rep -= 10; spend += 3000;
  }
  if(contrast(b.colors.accent, b.colors.primary) < 2){
    violations.push('Акцентный цвет сливается с основным');
    rep -= 5; spend += 2000;
  }
  if(b.typo.headingLS > 8){
    violations.push('Трекинг заголовков слишком большой');
    rep -= 5;
  }
  if(b.typo.lineHeight < 1.2 || b.typo.lineHeight > 2.2){
    violations.push('Интерлиньяж вне комфортного диапазона');
    rep -= 5;
  }
  if(b.customLogo){
    const info = getCustomLogoInfo();
    if(!info || !info.hasViewBox) violations.push('В SVG нет viewBox - плохо масштабируется');
    else if(info.nodes > 300) violations.push('SVG слишком сложный');
    if(info && info.hasExternalImage) violations.push('SVG ссылается на внешние изображения');
  }
  if(!b.name.trim()){
    violations.push('У бренда нет названия');
    rep -= 5;
  }
  rep = Math.max(30, rep);
  return { rep, spend, remaining: Math.max(0, cl.budget - spend), violations, budget: cl.budget };
}

/* =========================================================
   ОЦЕНКА
   ========================================================= */
function getConstraintItems(cl){
  if(!cl._constraintItems || cl._orderNo !== state.orderNo){
    const items = [
      ...cl.briefText.map(t => ({text: t, real: true})),
      ...cl.distractors.map(t => ({text: t, real: false}))
    ];
    let seed = parseInt(state.orderNo) + cl.id.length;
    for(let i = items.length - 1; i > 0; i--){
      seed = (seed * 9301 + 49297) % 233280;
      const j = Math.floor((seed / 233280) * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    cl._constraintItems = items;
    cl._orderNo = state.orderNo;
  }
  return cl._constraintItems;
}

function evaluate(n){
  if(n===1) return evalBrief();
  if(n===2) return evalBrand();
  if(n===3) return evalUI();
  if(n===4) return evalAd();
  return evalFinal();
}

function evalBrief(){
  const cl = state.client, b = state.brief, checks = [];
  let pts = 0;

  const audOk = b.audience === cl.audienceCorrect;
  checks.push({ok:audOk, pts:15, text: audOk
    ? 'Целевая аудитория определена верно'
    : 'Аудитория выбрана неверно - перечитайте бриф'});
  if(audOk) pts += 15;

  const matched = b.tones.filter(t=>cl.tones.includes(t)).length;
  const wrongTones = b.tones.filter(t=>!cl.tones.includes(t)).length;
  const tonePts = Math.max(0, matched * 5 - wrongTones * 2);
  checks.push({ok:matched>=2 && wrongTones===0, pts:tonePts, text:
    `Характер: совпало ${matched}, лишних ${wrongTones}.`});
  pts += tonePts;

  const noteOk = b.note.trim().length >= 40;
  checks.push({ok:noteOk, pts:10, text: noteOk
    ? 'Ключевая мысль бренда сформулирована'
    : 'Ключевая мысль слишком короткая (нужно ≥ 40)'});
  if(noteOk) pts += 10;

  const items = getConstraintItems(cl);
  const checkedReal = b.constraints.filter(i => items[i] && items[i].real).length;
  const checkedFake = b.constraints.filter(i => items[i] && !items[i].real).length;
  const totalReal = items.filter(i => i.real).length;
  let consPts = 0, consMsg = '';
  if(checkedFake > 0){
    consMsg = `Отмечено ложных ограничений: ${checkedFake}. Реальных: ${checkedReal}/${totalReal}`;
    consPts = Math.max(0, Math.round(10 * checkedReal / totalReal) - checkedFake * 3);
  } else if(checkedReal < totalReal){
    consMsg = `Пропущено реальных ограничений: ${totalReal - checkedReal}`;
    consPts = Math.round(10 * checkedReal / totalReal);
  } else {
    consMsg = 'Все реальные ограничения отмечены верно';
    consPts = 10;
  }
  checks.push({ok: checkedReal===totalReal && checkedFake===0, pts:consPts, text:consMsg});
  pts += consPts;

  return {checks, pts: Math.min(50, pts)};
}

function evalBrand(){
  const cl = state.client, b = state.brand, checks = [];
  let pts = 0;

  const nm = b.name.trim();
  const nameOk = nm.length >= 3 && nm.length <= 16;
  checks.push({ok:nameOk, pts:7, text: nameOk
    ? 'Название оформлено корректно'
    : 'Название должно быть от 3 до 16 символов'});
  if(nameOk) pts += 7;

  const shapeOk = cl.likes.shapes.includes(b.shape) && !(cl.forbid.shapes||[]).includes(b.shape);
  checks.push({ok:shapeOk, pts:7, text: shapeOk
    ? 'Форма логотипа поддерживает характер бренда'
    : 'Форма логотипа спорит с характером бренда'});
  if(shapeOk) pts += 7;

  const markForbidden = (cl.forbid.marks||[]).includes(b.mark);
  const markOk = cl.likes.marks.includes(b.mark) && !markForbidden && b.mark !== 'none';
  checks.push({ok:markOk, pts:7, text: markForbidden
    ? 'Этот графический знак клиент прямо запретил'
    : (markOk ? 'Графический знак попадает в ожидания'
              : 'Графический знак не поддерживает идею бренда')});
  if(markOk) pts += 7;

  const palOk = cl.likes.palettes.includes(b.paletteId) && !(cl.forbid.palettes||[]).includes(b.paletteId);
  checks.push({ok:palOk, pts:7, text: palOk
    ? 'Цветовая палитра соответствует ожиданиям'
    : (b.paletteId ? 'Палитра не совпадает с характером бренда'
                   : 'Палитра не выбрана')});
  if(palOk) pts += 7;

  const cr = contrast(b.colors.ink, b.colors.bg);
  const crOk = cr >= 4.5;
  checks.push({ok:crOk, pts:6, text: crOk
    ? `Контраст текста в норме (${cr.toFixed(1)}:1)`
    : `Контраст текста слишком низкий (${cr.toFixed(1)}:1), нужно ≥ 4.5:1`});
  if(crOk) pts += 6;

  const hf = b.headingFont, bf = b.bodyFont;
  const bothDisplay = hf === 'display' && bf === 'display';
  const bothMono = hf === 'mono' && bf === 'mono';
  const pairOk = !bothDisplay && !bothMono;
  checks.push({ok:pairOk, pts:6, text: pairOk
    ? 'Шрифтовая пара работает'
    : 'Неудачная пара: два дисплейных/моноширинных шрифта'});
  if(pairOk) pts += 6;

  const typoOk = b.typo.headingScale >= 1.2 && b.typo.headingScale <= 1.8
              && b.typo.lineHeight >= 1.3 && b.typo.lineHeight <= 1.9
              && Math.abs(b.typo.headingLS) <= 4;
  checks.push({ok:typoOk, pts:5, text: typoOk
    ? 'Типографические параметры в норме'
    : 'Проверьте масштаб заголовков, интерлиньяж и трекинг'});
  if(typoOk) pts += 5;

  if(b.customLogo){
    const info = getCustomLogoInfo();
    let ok = true, msg = 'Загруженный SVG-логотип корректен';
    if(!info) { ok = false; msg = 'SVG не читается'; }
    else if(!info.hasViewBox) { ok = false; msg = 'В SVG нет viewBox'; }
    else if(info.nodes < 2) { ok = false; msg = 'SVG почти пустой'; }
    else if(info.nodes > 300) { ok = false; msg = 'SVG слишком сложный'; }
    checks.push({ok, pts:5, text: msg});
    if(ok) pts += 5;
  } else {
    checks.push({ok:true, pts:5, text:'Логотип собран в конструкторе'});
    pts += 5;
  }

  return {checks, pts: Math.min(50, pts)};
}

function evalUI(){
  const u = state.ui, en = u.enabled, checks = [];
  let pts = 0;

  const heroOk = !!en.hero;
  checks.push({ok:heroOk, pts:10, text: heroOk ? 'Первый экран на месте' : 'Нет первого экрана'});
  if(heroOk) pts += 10;

  const ctaOk = !!en.cta;
  checks.push({ok:ctaOk, pts:10, text: ctaOk ? 'Есть призыв к действию' : 'Нет призыва к действию'});
  if(ctaOk) pts += 10;

  const frameOk = !!en.header && !!en.footer;
  checks.push({ok:frameOk, pts:10, text: frameOk ? 'Шапка и подвал собраны' : 'Не хватает шапки или подвала'});
  if(frameOk) pts += 10;

  const count = Object.values(en).filter(Boolean).length;
  const countOk = count >= 4 && count <= 6;
  checks.push({ok:countOk, pts:10, text: countOk
    ? `Количество блоков оптимально (${count})`
    : `Блоков ${count}: для лендинга лучше 4–6`});
  if(countOk) pts += 10;

  const cr = contrast(state.brand.colors.ink, state.brand.colors.bg);
  const crOk = cr >= 4.5;
  checks.push({ok:crOk, pts:10, text: crOk
    ? `Читаемость интерфейса в норме (${cr.toFixed(1)}:1)`
    : `Текст плохо читается (${cr.toFixed(1)}:1)`});
  if(crOk) pts += 10;

  return {checks, pts: Math.min(50, pts)};
}

function evalAd(){
  const a = state.ad, checks = [];
  let pts = 0;

  const hLen = a.headline.trim().length;
  const hOk = hLen >= 10 && hLen <= 45;
  checks.push({ok:hOk, pts:10, text: hOk ? 'Заголовок короткий и цепляющий'
    : (hLen === 0 ? 'Заголовок не заполнен' : `Заголовок ${hLen} символов - нужно 10–45`)});
  if(hOk) pts += 10;

  const sLen = a.sub.trim().length;
  const sOk = sLen >= 20 && sLen <= 90;
  checks.push({ok:sOk, pts:10, text: sOk ? 'Подзаголовок раскрывает мысль'
    : (sLen === 0 ? 'Подзаголовок не заполнен' : `Подзаголовок ${sLen} - нужно 20–90`)});
  if(sOk) pts += 10;

  const cLen = a.cta.trim().length;
  const cOk = cLen >= 2 && cLen <= 20;
  checks.push({ok:cOk, pts:10, text: cOk ? 'Призыв к действию сформулирован'
    : (cLen === 0 ? 'CTA не заполнен' : 'CTA - от 2 до 20 символов')});
  if(cOk) pts += 10;

  const cr = contrast(state.brand.colors.accent, state.brand.colors.primary);
  const crOk = cr >= 3;
  checks.push({ok:crOk, pts:10, text: crOk
    ? `Кнопка CTA хорошо выделяется (${cr.toFixed(1)}:1)`
    : `Кнопка CTA сливается с фоном (${cr.toFixed(1)}:1), нужно ≥ 3:1`});
  if(crOk) pts += 10;

  const logoOk = !!a.showLogo;
  checks.push({ok:logoOk, pts:10, text: logoOk ? 'Логотип на носителе' : 'На макете нет логотипа'});
  if(logoOk) pts += 10;

  return {checks, pts: Math.min(50, pts)};
}

function evalFinal(){
  const meta = computeMeta(), checks = [];
  let pts = 0;

  const dLen = state.defense.trim().length;
  const dOk = dLen >= 100;
  checks.push({ok:dOk, pts:20, text: dOk ? 'Защита проекта описана'
    : `Текст защиты слишком короткий (${dLen}, нужно ≥ 100)`});
  if(dOk) pts += 20;

  const budPts = Math.round(Math.min(1, meta.remaining / meta.budget) * 15);
  checks.push({ok:budPts >= 10, pts:budPts, text:
    `Бюджет: осталось ${fmtMoney(meta.remaining)} из ${fmtMoney(meta.budget)}`});
  pts += budPts;

  const repPts = Math.round(Math.max(0, (meta.rep - 30) / 70) * 15);
  checks.push({ok:repPts >= 10, pts:repPts, text: `Репутация: ${meta.rep} / 100`});
  pts += repPts;

  return {checks, pts: Math.min(50, pts)};
}

   ЛОГОТИП
   ========================================================= */
function logoSVG(size){
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">${logoMarkup()}</svg>`;
}

function logoMarkup(){
  const b = state.brand, c = b.colors;
  const fill = c.primary;
  const markColor = bestOn(fill);
  let shapeEl = '';

  switch(b.shape){
    case 'circle': shapeEl = `<circle cx="50" cy="50" r="48" fill="${fill}"/>`; break;
    case 'round':  shapeEl = `<rect x="2" y="2" width="96" height="96" rx="26" fill="${fill}"/>`; break;
    case 'hex':    shapeEl = `<polygon points="50,2 92,26 92,74 50,98 8,74 8,26" fill="${fill}"/>`; break;
    case 'tri':    shapeEl = `<polygon points="50,8 95,90 5,90" fill="${fill}"/>`; break;
    case 'shield': shapeEl = `<path d="M50 2 L94 16 V52 C94 76 74 92 50 98 C26 92 6 76 6 52 V16 Z" fill="${fill}"/>`; break;
    case 'ring':   shapeEl = `<circle cx="50" cy="50" r="42" fill="none" stroke="${fill}" stroke-width="13"/>`; break;
    case 'blob':   shapeEl = `<path d="M50 3 C78 3 97 22 97 48 C97 76 76 97 48 97 C22 97 3 78 3 50 C3 22 22 3 50 3 Z" fill="${fill}"/>`; break;
    default:       shapeEl = `<circle cx="50" cy="50" r="48" fill="${fill}"/>`;
  }

  const baseScale = (b.shape==='tri') ? 0.58 : (b.shape==='ring' ? 0.62 : 0.86);
  const safe = 1 - (b.logo.safeArea||0)/100 * 1.2;
  const scale = baseScale * safe;

  const letter = (b.name.trim()[0] || 'A').toUpperCase();
  const strokeAttrs = `fill="none" stroke="${markColor}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"`;
  let markEl = '';

  switch(b.mark){
    case 'monogram':
      markEl = `<text x="50" y="52" text-anchor="middle" dominant-baseline="middle"
        font-family="${fontCss(b.headingFont)}" font-weight="800" font-size="54"
        fill="${markColor}">${esc(letter)}</text>`;
      break;
    case 'dots':
      markEl = [0,1,2].map(r=>[0,1,2].map(k=>
        `<circle cx="${32+k*18}" cy="${32+r*18}" r="5.5" fill="${markColor}"/>`).join('')).join('');
      break;
    case 'spark':
      markEl = `<path d="M50 14 L59 41 L86 50 L59 59 L50 86 L41 59 L14 50 L41 41 Z" fill="${markColor}"/>`;
      break;
    case 'wave':
      markEl = `<path d="M20 60 C30 34 42 34 50 60 C58 34 70 34 80 60" ${strokeAttrs}/>`;
      break;
    case 'arrow':
      markEl = `<path d="M32 68 L68 32 M68 32 H46 M68 32 V54" ${strokeAttrs}/>`;
      break;
    case 'leaf':
      markEl = `<path d="M26 74 C26 42 46 26 74 26 C74 58 54 74 26 74 Z" fill="${markColor}"/>`;
      break;
    default: markEl = '';
  }

  return shapeEl + `<g transform="translate(50 50) scale(${scale}) translate(-50 -50)">${markEl}</g>`;
}

function currentLogoSVG(size){
  if(state.brand.customLogo){
    const raw = state.brand.customLogo.svg;
    return raw.replace(/<svg([^>]*)>/, (m, attrs) => {
      let a = attrs.replace(/\s(width|height)="[^"]*"/g, '');
      return `<svg${a} width="${size}" height="${size}" preserveAspectRatio="xMidYMid meet">`;
    });
  }
  return logoSVG(size);
}

function logoImgSrc(){
  if(state.brand.customLogo) return svgToDataUrl(state.brand.customLogo.svg);
  return svgToDataUrl(logoSVG(400));
}

async function doLoadFont(){
  const fileInput = document.getElementById('fontFileInput');
  const urlInput = document.getElementById('fontUrlInput');
  const nameInput = document.getElementById('fontNameInput');
  try {
    if(fileInput.files && fileInput.files[0]){
      const file = fileInput.files[0];
      const name = (nameInput.value.trim() || file.name.replace(/\.[^.]+$/, ''));
      await addFileFont(file, name);
      toast('Шрифт «' + name + '» загружен');
      closeModal(); renderAll();
    } else if(urlInput.value.trim()){
      const family = await addUrlFont(urlInput.value.trim());
      toast('Шрифт «' + family + '» подключён');
      closeModal(); renderAll();
    } else {
      toast('Выберите файл или укажите ссылку');
    }
  } catch(e){
    console.error(e);
    toast('Ошибка: ' + (e.message || 'не удалось загрузить шрифт'));
  }
}

/* =========================================================
   ДЕЙСТВИЯ
   ========================================================= */
function toast(msg, opts){
  const t = $('#toast');
  const dur = (opts && opts.duration) || 2400;
  t.innerHTML = (opts && opts.spinner ? '<span class="spinner"></span>' : '') + esc(msg);
  t.classList.add('show');
  clearTimeout(t._tm);
  if(dur !== Infinity) t._tm = setTimeout(()=>t.classList.remove('show'), dur);
}
function hideToast(){
  const t = $('#toast');
  t.classList.remove('show');
}

function goToStage(n){
  if(!state || n > state.maxStage) return;
  state.stage = n;
  if(n===2) state.previewTab = 'logo';
  if(n===3) state.previewTab = 'site';
  if(n===4) state.previewTab = 'poster';
  if(n===5) state.previewTab = 'card';
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

function handleAction(act, val){
  if(act === 'showPicker'){ showClientPicker(); return; }
  if(!state) return;
  const b = state.brand, br = state.brief, u = state.ui, a = state.ad;

  switch(act){
    case 'audience': br.audience = Number(val); renderAll(); break;
    case 'tone': {
      const i = br.tones.indexOf(val);
      if(i >= 0) br.tones.splice(i,1);
      else {
        if(br.tones.length >= 3){ toast('Не более 3 качеств'); return; }
        br.tones.push(val);
      }
      renderAll(); break;
    }
    case 'constraint': {
      const i = Number(val);
      const k = br.constraints.indexOf(i);
      if(k >= 0) br.constraints.splice(k,1); else br.constraints.push(i);
      renderAll(); break;
    }
    case 'shape': b.shape = val; renderAll(); break;
    case 'mark': b.mark = val; renderAll(); break;
    case 'palette': {
      const p = PALETTES.find(x=>x.id===val);
      if(p){ b.paletteId = p.id; b.colors = Object.assign({}, p.colors); }
      renderAll(); break;
    }
    case 'hfont': b.headingFont = val; renderAll(); break;
    case 'bfont': b.bodyFont = val; renderAll(); break;
    case 'hweight': b.typo.headingWeight = Number(val); renderAll(); break;
    case 'htransform': b.typo.headingTransform = val; renderAll(); break;
    case 'loadFont': openFontModal(); break;
    case 'uploadSVG': openSVGUpload(); break;
    case 'pasteSVG': openSVGPasteModal(); break;
    case 'clearCustomLogo': b.customLogo = null; renderAll(); break;
    case 'uitype': u.type = val; renderAll(); break;
    case 'block': u.enabled[val] = !u.enabled[val]; renderAll(); break;
    case 'density': u.density = val; renderAll(); break;
    case 'medium': a.medium = val; renderAll(); break;
    case 'showLogo': a.showLogo = !a.showLogo; renderAll(); break;
    case 'submit': submitStage(Number(val)); break;
    case 'exportSVG': exportBrandboardSVG(); break;
    case 'exportBrandbookPDF': exportBrandbookPDF(); break;
    case 'exportTXT': exportReport(); break;
  }
}

function handleField(field, value){
  if(!state) return;
  if(field === 'briefNote'){ state.brief.note = value; }
  else if(field === 'brandName'){ state.brand.name = value; renderPreview(); }
  else if(field === 'adHeadline'){ state.ad.headline = value; renderPreview(); }
  else if(field === 'adSub'){ state.ad.sub = value; renderPreview(); }
  else if(field === 'adCta'){ state.ad.cta = value; renderPreview(); }
  else if(field === 'defense'){ state.defense = value; }
  else if(field.startsWith('color:')){
    const k = field.split(':')[1];
    state.brand.colors[k] = value;
    document.querySelectorAll('[data-hex="'+k+'"]').forEach(e=>e.textContent = value);
    renderPreview(); renderHeader();
  }
  else if(field === 'fontScale' || field === 'radius'){
    state.ui[field] = Number(value);
    const out = document.querySelector('[data-out="'+field+'"]');
    if(out) out.textContent = value + 'px';
    renderPreview();
  }
  else if(field === 'safeArea'){
    state.brand.logo.safeArea = Number(value);
    const out = document.querySelector('[data-out="safeArea"]');
    if(out) out.textContent = value + '%';
    renderPreview();
  }
  else if(field === 'headingScale'){
    state.brand.typo.headingScale = Number(value);
    const out = document.querySelector('[data-out="headingScale"]');
    if(out) out.textContent = Number(value).toFixed(2);
    renderPreview();
  }
  else if(field === 'lineHeight'){
    state.brand.typo.lineHeight = Number(value);
    const out = document.querySelector('[data-out="lineHeight"]');
    if(out) out.textContent = Number(value).toFixed(2);
    renderPreview();
  }
  else if(field === 'headingLS'){
    state.brand.typo.headingLS = Number(value);
    const out = document.querySelector('[data-out="headingLS"]');
    if(out) out.textContent = value;
    renderPreview();
  }
}

function submitStage(n){
  const prev = state.scores[n];
  if(prev != null){
    session.spentExtra += 1500;
    session.repPenalty += 2;
    session.attempts[n] = (session.attempts[n] || 1) + 1;
  } else {
    session.attempts[n] = 1;
  }
  const res = evaluate(n);
  state.scores[n] = Math.max(prev || 0, res.pts);
  if(n + 1 > state.maxStage) state.maxStage = n + 1;
  showResult(n, res);
  renderAll();
}

/* =========================================================
   ЭКСПОРТ SVG
   ========================================================= */
function download(filename, content, type){
  const blob = new Blob([content], {type: type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

async function exportBrandbookPDF(){
  if(typeof html2canvas === 'undefined' || !window.jspdf){
    toast('Для PDF-экспорта нужен интернет (CDN html2canvas + jsPDF)');
    return;
  }
  await document.fonts.ready;

  toast('Создается брендбук…', {spinner: true, duration: Infinity});

  const W = 1980, H = 1080;
  const slides = buildBrandbookSlides();

  const render = document.createElement('div');
  render.id = 'pdf-render';
  document.body.appendChild(render);

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: 'landscape',
      unit: 'px',
      format: [W, H],
      hotfixes: ['px_scaling']
    });

    for(let i = 0; i < slides.length; i++){
      render.innerHTML = slides[i];
      const slideEl = render.firstElementChild;
      if(!slideEl) continue;
      await new Promise(r => setTimeout(r, 120));

      const canvas = await html2canvas(slideEl, {
        width: W, height: H, scale: 1, useCORS: true,
        backgroundColor: '#ffffff', logging: false
      });
      const imgData = canvas.toDataURL('image/jpeg', 0.93);

      if(i > 0) pdf.addPage([W, H], 'landscape');
      pdf.addImage(imgData, 'JPEG', 0, 0, W, H);
    }

    pdf.save(`brandbook-${state.orderNo}.pdf`);
    toast('Брендбук сохранён');
  } catch(e){
    console.error(e);
    toast('Ошибка экспорта: ' + (e.message || 'попробуйте снова'));
  } finally {
    render.remove();
    hideToast();
  }
}

function exportReport(){
  const b = state.brand, cl = state.client, meta = computeMeta();
  const total = [1,2,3,4,5].reduce((s,i)=>s+(state.scores[i]||0),0);
  const pct = Math.round(total/250*100);
  const grade = pct>=90?5:pct>=75?4:pct>=60?3:2;
  const L = [];
  L.push('========================================');
  L.push('  DESIGN STUDIO - ОТЧЁТ');
  L.push('  Заказ #' + state.orderNo);
  L.push('========================================');
  L.push('');
  L.push('КЛИЕНТ: ' + cl.name);
  L.push('Сфера: ' + cl.sphere);
  L.push('Бюджет: ' + fmtMoney(cl.budget) + '   Срок: ' + cl.deadline);
  L.push('');
  L.push('--- ЭТАП 1. БРИФ ---');

  L.push('Логотип: ' + (b.customLogo ? 'свой SVG (' + b.customLogo.filename + ')' :
    (SHAPES.find(s=>s.id===b.shape)?.label || '') + ' / ' + (MARKS.find(m=>m.id===b.mark)?.label || '')));
  L.push('Палитра: ' + (PALETTES.find(p=>p.id===b.paletteId)?.name || 'custom'));
  L.push('Цвета: ' + Object.entries(b.colors).map(([k,v])=>k+' '+v).join(' | '));
  L.push('Шрифты: ' + fontLabel(b.headingFont) + ' / ' + fontLabel(b.bodyFont));
  L.push('Типографика: ×' + b.typo.headingScale.toFixed(2) + ', интерлиньяж ' + b.typo.lineHeight.toFixed(2) +
    ', трекинг ' + b.typo.headingLS + 'px, начертание ' + b.typo.headingWeight);
  L.push('Безопасное поле: ' + b.logo.safeArea + '%');
  L.push('');
  L.push('--- ЭТАП 3. UI ---');
  L.push('Тип: ' + (state.ui.type==='app'?'Mobile app':'Landing'));
  L.push('Блоки: ' + BLOCKS.filter(x=>state.ui.enabled[x.id]).map(x=>x.label).join(', '));
  L.push('Базовый шрифт: ' + state.ui.fontScale + 'px, скругление: ' + state.ui.radius + 'px');
  L.push('');
  L.push('--- ЭТАП 4. РЕКЛАМА ---');
  L.push('Носитель: ' + state.ad.medium);
  L.push('Заголовок: ' + state.ad.headline);
  L.push('Подзаголовок: ' + state.ad.sub);
  L.push('CTA: ' + state.ad.cta);
  L.push('');
  L.push('--- ЭТАП 5. ЗАЩИТА ---');
  L.push(state.defense || '-');
  L.push('');
  L.push('--- РЕЗУЛЬТАТЫ ---');
  STAGES.forEach(st=>L.push(st.n + '. ' + st.name + ': ' + (state.scores[st.n]!=null ? state.scores[st.n]+'/50' : '-')));
  L.push('ИТОГО: ' + total + '/250 (' + pct + '%) - оценка ' + grade);
  L.push('');
  L.push('Репутация: ' + meta.rep + '/100');
  L.push('Потрачено: ' + fmtMoney(meta.spend));
  L.push('Остаток: ' + fmtMoney(meta.remaining));
  if(session.customFonts.length) L.push('Шрифты: ' + session.customFonts.map(f=>f.family).join(', '));
  if(b.customLogo) L.push('SVG: ' + b.customLogo.filename);
  if(meta.violations.length){
    L.push('Замечания:');
    meta.violations.forEach(v=>L.push(' - ' + v));
  } else {
    L.push('Замечаний нет.');
  }
  download('report-' + state.orderNo + '.txt', L.join('\n'), 'text/plain;charset=utf-8');
  toast('Отчёт .txt скачан');
}

$('#panel').addEventListener('click', e=>{
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  handleAction(btn.dataset.act, btn.dataset.val);
});

$('#panel').addEventListener('input', e=>{
  const f = e.target.closest('[data-field]');
  if(!f) return;
  handleField(f.dataset.field, f.value);
});

$('#steps').addEventListener('click', e=>{
  const s = e.target.closest('[data-goto]');
  if(!s || s.disabled) return;
  goToStage(Number(s.dataset.goto));
});

$('#prevTabs').addEventListener('click', e=>{
  const t = e.target.closest('[data-tab]');
  if(!t || !state) return;
  state.previewTab = t.dataset.tab;
  renderPreview();
});

$('#modal').addEventListener('click', async e=>{
  // Выбор клиента
  const pick = e.target.closest('[data-pick]');
  if(pick){ pickClient(pick.dataset.pick); return; }

  const btn = e.target.closest('[data-mact]');
  if(!btn) return;
  const act = btn.dataset.mact;
  if(act === 'close'){ closeModal(); return; }
  if(act === 'next'){
    closeModal();
    goToStage(Math.min(5, Number(btn.dataset.val) + 1));
    return;
  }
  if(act === 'loadFont'){ await doLoadFont(); return; }
  if(act === 'pasteSVG'){ doPasteSVG(); return; }
});
