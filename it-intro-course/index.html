<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Wheel of IT - Введение в специальность</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🎡 Колесо ИТ-Судьбы</h1>
        
        <div class="wheel-wrapper">
            <canvas id="wheel" width="500" height="500"></canvas>
            <div class="arrow"></div>
        </div>

        <div class="controls">
            <button id="spinBtn">Крутить колесо</button>
            <button id="rerollBtn" class="hidden">Использовать шанс (Перекрутить)</button>
        </div>

        <div id="topicDetail" class="detail-card hidden">
            <h2 id="topicTitle"></h2>
            <p id="topicDesc"></p>
            <div class="meta">
                <span>👥 Команда: <b id="teamSize"></b> чел.</span>
                <span>⚡ Сложность: <b id="difficulty"></b></span>
            </div>
            <div class="task-box">
                <strong>Задание на 90 минут:</strong>
                <p id="topicTask"></p>
            </div>
        </div>
    </div>

    <script src="assets/js/wheel.js"></script>
</body>
</html>
