<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT_SESSION // NOTHING_OS_V3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="nothing-os">
    <!-- СЛОЙ 0: Фон темы -->
    <div id="productBg" class="bg-layer"></div>

    <!-- СЛОЙ 1: Умные точки (Инвертируют цвет) -->
    <div class="smart-dots-layer"></div>

    <!-- СЛОЙ 2: Системный UI (Всегда сверху) -->
    <div class="system-ui type-callout">
        <div class="top-left type-body ">TIME // <span id="clock">00:00:00</span></div>
        <div class="top-right type-body">
            KNOWLEDGE_LOAD // <div class="mini-bar"><div></div></div> 84%
        </div>
        <div class="bottom-left type-body">TEMP // 24°C OUTSIDE</div>
        <div class="bottom-right type-body">REF. №IT_2024_S1</div>
    </div>

    <!-- СЛОЙ 3: Контент приложения -->
    <main id="app-container" class="view-wheel">
        
        <!-- ЭКРАН 1: КОЛЕСО -->
        <section class="screen wheel-screen">
            <div class="wheel-box">
                <div class="pointer"></div>
                <canvas id="wheel" width="600" height="600"></canvas>
            </div>
            <button id="spinBtn" class="btn-main">GENERATE_PATH</button>
        </section>

        <!-- ЭКРАН 2: СТРАНИЦА ТЕМЫ -->
        <section class="screen product-screen">
            <div id="productBg" class="bg-image"></div>
            <!-- Сетка летающих иконок (как на скрине Nothing) -->
            <div id="features-container" class="features-layer"></div>

            <!-- Центральная карточка -->
            <div class="info-card glass">
                <div class="tag matrix-text" id="topicTag">#DESIGN • LIVE</div>
                <h1 id="topicTitle" class="matrix-text main-title">TOPIC_NAME</h1>
                
                <div class="tasks">
                    <div class="task-item">
                        <span class="label type-body">// LIVE_CODING</span>
                        <p id="liveTask" class="type-body">...</p>
                    </div>
                    <div class="task-item yellow">
                        <span class="label type-body">// INDEPENDENT_WORK</span>
                        <p id="selfTask" class="type-body">...</p>
                    </div>
                </div>

                <div class="card-footer">
                    <div class="meta type-body">
                        TEAM: <span id="teamSize">2</span>_PERS<br>
                        LEVEL: <span id="difficulty">01</span>
                    </div>
                    <div class="btns">
                        <button class="btn-main-white" onclick="location.reload()">FINISH_SESSION</button>
                        <button id="rerollBtn" class="btn-outline type-body">RE_ROLL_SYSTEM</button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
