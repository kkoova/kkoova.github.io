<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT_SESSION // NOTHING_OS_V3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="nothing-os">
    <!-- СЛОЙ 0: Фон темы -->
    <div id="productBg" class="bg-layer"></div>

    <!-- СЛОЙ 1: Умные точки (Инвертируют цвет) -->
    <div class="smart-dots-layer"></div>

    <!-- СЛОЙ 2: Системный UI (Всегда сверху) -->
    <div class="system-ui">
        <div class="top-left type-body ">TIME // <span id="clock">00:00:00</span></div>
        <div class="top-right type-body">
            KNOWLEDGE_LOAD // <div class="mini-bar"><div></div></div> 84%
        </div>
        <div class="bottom-left type-body">ROLE // <span id="user-role">STUDENT</span></div>
        <div class="bottom-right type-body">REF. №IT_2026_S1</div>
    </div>
    <div id="login-overlay" class="logbook-overlay active">
        <div class="logbook-card glass">
            <div class="matrix-text" style="font-size: 2rem; margin-bottom: 20px;">SYSTEM_AUTH</div>
            <p class="type-body" style="color: #666; margin-bottom: 30px;">REQUIRED: GITHUB_ACCOUNT</p>
            
            <button id="github-auth-btn" class="btn-main-white" style="display: flex; align-items: center; gap: 10px; margin: 0 auto;">
                <img src="assets/icons/github-dark.png" width="20"> 
                AUTHORIZE_VIA_GITHUB
            </button>
        </div>
    </div>
    <!-- СЛОЙ 3: Контент приложения -->
    <main id="app-container" class="view-wheel">
        
        <!-- ЭКРАН 1: КОЛЕСО -->
        <section class="screen wheel-screen">
            <div class="wheel-box">
                <div class="pointer"></div>
                <canvas id="wheel" width="600" height="600"></canvas>
            </div>
            <button id="spinBtn" class="btn-main">GENERATE_PATH</button>
            <div id="student-tools" class="student-input-zone">
                <input type="text" id="topicCodeInput" class="git-input" placeholder="ENTER_TOPIC_CODE">
                <button onclick="unlockTopic()" class="btn-outline">UNLOCK_TASK</button>
            </div>
        </section>

        <!-- ЭКРАН 2: СТРАНИЦА ТЕМЫ -->
        <section class="screen product-screen">
            <div id="productBg" class="bg-image"></div>
            <!-- Сетка летающих иконок (как на скрине Nothing) -->
            <div id="features-container" class="features-layer"></div>

            <!-- Центральная карточка -->
            <div class="info-card glass">
                <div id="topic-presentation">
                    <div class="tag matrix-text" id="topicTag">#DESIGN • LIVE</div>
                    <h1 id="topicTitle" class="matrix-text main-title">TOPIC_NAME</h1>
                    
                    <div class="tasks">
                        <div class="task-item">
                            <span class="label type-body">// LIVE_CODING</span>
                            <p id="liveTask" class="type-body">...</p>
                        </div>
                        <div class="task-item yellow">
                            <span class="label type-body">// INDEPENDENT_WORK</span>
                            <p id="selfTask" class="type-body">...</p>
                        </div>
                    </div>

                    <div class="card-footer">
                        <div class="meta type-body">
                            TEAM: <span id="teamSize">2</span>_PERS<br>
                            LEVEL: <span id="difficulty">01</span>
                        </div>
                    </div>
                </div>
                <div id="topic-workspace" class="hidden">
                    <div class="workspace-header">
                        <span class="type-body yellow">// MISSION_PROGRESS</span>
                        <div class="progress-line"><div id="step-progress"></div></div>
                    </div>

                    <div id="steps-list" class="steps-container"></div>
                </div>
                <div class="btns">
                    <button id="admin-btn" class="btn-main-white" onclick="saveSession()">FINISH_SESSION</button>
                    <button id="rerollBtn" class="btn-outline type-body">RE_ROLL_SYSTEM</button>
                    <button class="btn-main-white student-only" onclick="openReport()">SUBMIT_REPORT</button>
                    <a id="externalDocs" href="#" target="_blank" class="btn-outline type-body">OPEN_FULL_DOCUMENTATION</a>
                </div>
            </div>
            <div id="report-modal" class="report-overlay">
                <div class="submission-zone glass">
                    <div class="modal-header">
                        <h3 class="type-body">// SUBMIT_REPORT</h3>
                        <button class="close-btn" onclick="closeReport()">×</button>
                    </div>
                    
                    <div class="modal-body">
                        <div class="input-group">
                            <span class="label type-body">PARTNERS_FIO</span>
                            <input type="text" id="studentFIO" class="git-input" placeholder="IVANOV, PETROV...">
                        </div>
                        <div class="input-group">
                            <span class="label type-body">GITHUB_LINK</span>
                            <input type="text" id="repoLink" class="git-input" placeholder="https://github.com/...">
                        </div>
                    </div>

                    <button class="btn-main-white full-width" onclick="submitWork()">SEND_TO_LOGBOOK</button>
                </div>
            </div>
        </section>

    </main>

    <script type="module" src="script.js"></script>.
</body>
</html>
