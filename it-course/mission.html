<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MISSION // UI</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://kkoova.github.io/mobile-godot/css/style.css">
</head>
<body class="nothing-os doc-page">
    <div id="global-timer-overlay" class="timer-overlay">
        <div class="timer-content">
            <div class="timer-header matrix-text">CRITICAL_TIME_LIMIT</div>
            <div id="timer-display" class="timer-digits">00:00</div>
            
            <div class="timer-goals">
                <div class="goals-label type-body">CURRENT_OBJECTIVES:</div>
                <ul id="timer-goals-list" class="type-body">
                    <!-- Сюда попадут цели из Firebase -->
                </ul>
            </div>
            
            <!-- Кнопка закрытия видна ТОЛЬКО админу, чтобы он мог отменить -->
            <button id="admin-stop-timer" class="admin-only logout-trigger red" onclick="stopGlobalTimer()">[ ABORT_TIMER ]</button>
        </div>
    </div>
    <div class="smart-dots-layer"></div>
    <div class="doc-container">
        <header>
            <span id="unit-label" class="type-body"></span>
            <h1 id="unit-title" class="matrix-text" style="color: var(--accent-yellow);"></h1>
        </header>

        
        <div id="doc-content"></div> 
    </div>

    <script src="https://kkoova.github.io/mobile-godot/js/renderer.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        const docName = urlParams.get('doc') || 'git_basics.json';

        console.log("SYSTEM // Loading document:", docName);

        fetch(`./docs/${docName}`)
            .then(res => {
                if (!res.ok) throw new Error("Document not found");
                return res.json();
            })
            .then(data => renderLesson(data))
            .catch(err => {
                document.getElementById('doc-content').innerHTML = 
                    `<div class="type-body yellow">ERROR // DOCUMENT_NOT_FOUND: ${docName}</div>`;
            });
    </script>
</body>
</html>
